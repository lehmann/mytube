server {
    listen 80;
    server_name _;          # substitua pelo seu domínio/IP se necessário

    root /opt/myyoutube/client/dist;
    index index.html;

    # --- Streaming de vídeo ---
    # proxy_buffering off é crítico: sem isso o nginx tenta bufferizar
    # o vídeo inteiro na memória antes de enviar ao cliente.
    location /api/stream/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Demais rotas da API ---
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # --- SPA — React Router ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Gzip para assets de texto ---
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    image/svg+xml;
}
